<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Decision Tree Studio concept illustration</title><desc id="desc">A generic decision question connects to conditional follow-up questions; a side panel explains an option with benefits, risks and evidence. Illustration only, not a browser screenshot.</desc>
<defs><radialGradient id="bg"><stop stop-color="#253d34"/><stop offset="1" stop-color="#11191d"/></radialGradient></defs>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="44" y="56" fill="#f1f5f4" font-size="23" font-weight="700">Decision Tree Studio</text><text x="44" y="82" fill="#acbeb5" font-size="12">Questions with context. Decisions with reasons.</text><g stroke="#597a6b" fill="none" stroke-width="2"><path d="M378 175V218H200V264M378 218H557V264M200 328V379M557 328V379"/></g>
<g fill="#1b2926" stroke="#678b79"><rect x="260" y="118" width="236" height="72" rx="12"/><rect x="88" y="264" width="224" height="64" rx="12"/><rect x="445" y="264" width="224" height="64" rx="12"/><rect x="88" y="379" width="224" height="54" rx="12"/><rect x="445" y="379" width="224" height="54" rx="12" opacity=".45"/></g>
<g fill="#f1f5f4" font-size="15" text-anchor="middle"><text x="378" y="150">Who is the first audience?</text><text x="200" y="301">Name the pilot owner</text><text x="557" y="301">Plan the wider release</text><text x="200" y="412">Record feedback</text><text x="557" y="412" opacity=".5">Not applicable yet</text></g><g fill="#a0e3c2" font-size="11" text-anchor="middle"><text x="378" y="174">RECORDED · PILOT</text><text x="170" y="245">IF PILOT</text><text x="593" y="245">IF EVERYONE</text></g>
<rect x="740" y="112" width="416" height="321" rx="16" fill="#1a2329" stroke="#3c4b53"/><text x="767" y="147" fill="#a8cef5" font-size="11">ONE QUESTION AT A TIME</text><text x="767" y="181" fill="#f1f5f4" font-size="19" font-weight="650">Choose with a clear tradeoff.</text><rect x="763" y="201" width="370" height="47" rx="9" fill="#294638" stroke="#a0e3c2"/><text x="781" y="230" fill="#ecf6f1" font-size="14">Small pilot · Recommended</text><text x="767" y="281" fill="#a0e3c2" font-size="12">BENEFIT</text><text x="767" y="304" fill="#d8e0dd" font-size="12">Feedback stays manageable.</text><text x="767" y="335" fill="#f4c887" font-size="12">RISK</text><text x="767" y="358" fill="#d8e0dd" font-size="12">A small sample may miss other needs.</text><text x="767" y="397" fill="#a8cef5" font-size="11">EVIDENCE · EXAMPLES · LOCAL SESSION</text>
<text x="44" y="461" fill="#93a59b" font-size="10">CONCEPT ILLUSTRATION · Fictional sample content · Not a runtime screenshot</text></g></svg>
