name: Bug report
description: Report a reproducible behavior or rendering problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Use a small fictional document. Do not attach private answers, credentials or personal research.'
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: '0.1.0 or commit SHA'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: '1. Import the attached minimal document…'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, OS, interface language and viewport
      placeholder: 'Browser/version, OS, English/Persian, width, reduced-motion setting…'
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal fictional example or redacted screenshot
      description: 'Include only data you are allowed to share.'
