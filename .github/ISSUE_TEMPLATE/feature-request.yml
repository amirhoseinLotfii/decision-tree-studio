name: Feature request
description: Propose a focused improvement with a concrete use case.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What decision workflow is difficult today?
      description: 'Describe who needs this and give a concrete example.'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: roadmap
    attributes:
      label: Scope
      options:
        - label: 'I checked the roadmap and existing issues.'
          required: true
